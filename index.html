<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>超能工具箱 · 纯前端多功能工具集</title>
    <link rel="stylesheet" href="app/src/styles/tokens.css">
    <script src="js/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'rgb(var(--c-bg) / <alpha-value>)',
                        card: 'rgb(var(--c-card) / <alpha-value>)',
                        ink: 'rgb(var(--c-ink) / <alpha-value>)',
                        muted: 'rgb(var(--c-muted) / <alpha-value>)',
                        line: 'rgb(var(--c-line) / <alpha-value>)',
                        primary: 'rgb(var(--c-primary) / <alpha-value>)',
                        'primary-d': 'rgb(var(--c-primary-d) / <alpha-value>)'
                    },
                    borderRadius: { xl2: '1rem' },
                    boxShadow: { soft: '0 8px 24px rgba(31,41,95,.12)' }
                }
            }
        }
    </script>
    <script src="js/vue.global.prod.js"></script>
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark')
                }
            } catch (e) {}
        })()
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="app/src/main.js"></script>
    <noscript>本页面需要启用 JavaScript 才能运行。</noscript>
</body>
</html>
