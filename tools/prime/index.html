<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>质数工具 · 超能工具箱</title>
<script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<div class="container">
<a class="brand" href="../../index.html">🧰 超能工具箱</a>
<a class="back" href="../../index.html">← 返回主页</a>
<h2>🔢 质数工具</h2>
<div class="row">
<input id="n" placeholder="输入整数" type="number">
<button class="btn" onclick="check()">是否质数</button>
<button class="btn" onclick="factor()">质因数分解</button>
<button class="btn gray" onclick="listp()">列出 ≤N 的质数</button>
</div>
<div id="out"></div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>
function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
function isPrime(n){ if(n<2) return false; if(n<4) return true; if(n%2===0) return false; for(var i=3;i*i<=n;i+=2) if(n%i===0) return false; return true; }
function out(h){ document.getElementById('out').innerHTML=h; }
function check(){ var n=+document.getElementById('n').value; if(!Number.isInteger(n)){out('<p class="msg">请输入整数</p>');return;} out('<div class="ans"><pre>'+n+' 是'+(isPrime(n)?'质数 ✅':'合数 ❌')+'</pre></div>'); }
function factor(){ var n=+document.getElementById('n').value; if(n<2){out('<p class="msg">请输入 ≥2 的整数</p>');return;} var f=[],d=2,x=n; while(x>1){ while(x%d===0){f.push(d);x/=d;} d++; if(d*d>x){ if(x>1){f.push(x);break;} } } out('<div class="ans"><pre>'+n+' = '+f.join(' × ')+'</pre></div>'); }
function listp(){ var n=+document.getElementById('n').value; if(n<2){out('<p class="msg">请输入上限 ≥2</p>');return;} var r=[]; for(var i=2;i<=n;i++) if(isPrime(i)) r.push(i); out('<div class="ans"><pre>共 '+r.length+' 个质数：\n'+r.join(', ')+'</pre></div>'); }
</script>
