<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; justify-content:center; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#0f172a; color:#22d3ee; padding:24px; border-radius:10px; margin-top:12px; text-align:center; font-size:3rem; font-family:monospace; }
        .label { text-align:center; font-size:1rem; color:#64748b; margin-top:8px; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🍅 番茄钟</h2>
    <div class="flex">
        <button class="btn" onclick="setMode(25)">工作 25 分</button>
        <button class="btn green" onclick="setMode(5)">休息 5 分</button>
        <button class="btn" onclick="start()">开始</button>
        <button class="btn gray" onclick="pause()">暂停</button>
        <button class="btn gray" onclick="reset()">重置</button>
    </div>
    <div class="output-box" id="result">25:00</div>
    <div class="label" id="phase">工作模式</div>
</div>
<script>
    var total = 25*60, left = total, running = false, timer = null;
    function pad(n){ return (n<10?'0':'')+n; }
    function show(){ document.getElementById('result').textContent = pad(Math.floor(left/60))+':'+pad(left%60); }
    function setMode(m){ pause(); total = m*60; left = total; document.getElementById('phase').textContent = m===25?'工作模式':'休息模式'; show(); }
    function start(){ if(running) return; running=true; timer=setInterval(function(){ if(left<=0){ clearInterval(timer); running=false; return; } left--; show(); },1000); }
    function pause(){ running=false; clearInterval(timer); }
    function reset(){ pause(); left=total; show(); }
</script>

<!--SITE-LINKS-->

</body>
</html>
