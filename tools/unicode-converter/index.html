<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode 编码 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; min-height:90px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; max-height:200px; overflow-y:auto; font-size:0.9rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔡 Unicode 编码</h2>
    <textarea id="uniInput" placeholder="输入文本">Hello 世界 🌍</textarea>
    <div class="flex">
        <button class="btn" onclick="toCode()">🔢 字符→码点</button>
        <button class="btn green" onclick="toChar()">🔣 码点→字符</button>
        <button class="btn gray" onclick="clearUni()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function cp(ch) {
        var c = ch.codePointAt(0);
        return 'U+' + c.toString(16).toUpperCase().padStart ? 'U+' + c.toString(16).toUpperCase() : 'U+' + c.toString(16).toUpperCase();
    }
    function toCode() {
        var text = document.getElementById('uniInput').value;
        var out = [];
        for (var i = 0; i < text.length; i++) {
            var c = text.codePointAt(i);
            if (c > 0xFFFF) i++;
            out.push(text[i] ? text[i] : text[i-1]);
        }
        var str = document.getElementById('uniInput').value;
        var res = [];
        for (var j = 0; j < str.length; j++) {
            var code = str.codePointAt(j);
            if (code > 0xFFFF) j++;
            res.push('U+' + code.toString(16).toUpperCase().padStart(4, '0') + ' (' + code + ')');
        }
        document.getElementById('result').textContent = res.join('  ');
    }
    function toChar() {
        var text = document.getElementById('uniInput').value;
        var parts = text.split(/[\s,;]+/).filter(Boolean);
        var res = '';
        for (var i = 0; i < parts.length; i++) {
            var p = parts[i].replace(/^U\+/i, '').replace(/^0+/, '');
            var n = parseInt(p, 16);
            if (!isNaN(n)) res += String.fromCodePoint(n);
        }
        document.getElementById('result').textContent = res || '无有效码点';
    }
    function clearUni() { document.getElementById('uniInput').value = ''; document.getElementById('result').textContent = '已清空'; }
</script>

</body>
</html>
