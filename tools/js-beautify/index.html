<h2>💎 JS 代码美化</h2>
<div class="row"><textarea id="inp" rows="6" placeholder="粘贴 JS 代码"></textarea></div><div class="row"><button class="btn" onclick="go()">美化</button></div>
<div id="out"></div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
function go(){var s=document.getElementById('inp').value;var ind=0,out='';for(var i=0;i<s.length;i++){var c=s[i];if(c==='\}'||c===']'){ind=Math.max(0,ind-1);}out+=c;if(c==='\{'||c==='['||c==='('){ind++;}if(c===';'||c==='\{'){out+='\n'+'  '.repeat(ind);}}document.getElementById('out').innerHTML='<div class="ans"><pre>'+esc(out)+'</pre></div>';}
</script>
