<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编解码 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; min-height:100px; resize:vertical; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; font-size:0.9rem; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; max-height:200px; overflow-y:auto; font-size:0.9rem; }
        .hint { font-size:0.75rem; color:#94a3b8; margin-top:6px; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔐 Base64 编解码</h2>
    <textarea id="inputArea" placeholder="输入要编码/解码的文本">Hello 世界</textarea>
    <div class="flex">
        <button class="btn" onclick="encodeB64()">🔒 编码</button>
        <button class="btn green" onclick="decodeB64()">🔓 解码</button>
        <button class="btn gray" onclick="clearAll()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
    <div class="hint">💡 支持中文、emoji 等 Unicode 字符</div>
</div>
<script>
    function encodeB64() {
        const input = document.getElementById('inputArea').value;
        try {
            const encoded = btoa(unescape(encodeURIComponent(input)));
            document.getElementById('result').textContent = encoded;
        } catch(e) { document.getElementById('result').textContent = '编码失败: ' + e.message; }
    }
    function decodeB64() {
        const input = document.getElementById('inputArea').value;
        try {
            const decoded = decodeURIComponent(escape(atob(input)));
            document.getElementById('result').textContent = decoded;
        } catch(e) { document.getElementById('result').textContent = '解码失败，请检查输入是否为合法 Base64'; }
    }
    function clearAll() {
        document.getElementById('inputArea').value = '';
        document.getElementById('result').textContent = '已清空';
    }
</script>
</body>
</html>
