<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>公网 IP 查询 · 超能工具箱</title>
<script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<div class="container">
<a class="brand" href="../../index.html">🧰 超能工具箱</a>
<a class="back" href="../../index.html">← 返回主页</a>
<h2>📡 公网 IP 查询</h2>
<div class="row"><button class="btn" onclick="go()">查询公网 IP</button></div>
<div id="out"></div>
<div class="note">通过公共接口（ipify）获取本机公网 IPv4，需联网。仅在查询时发起请求，不收集任何信息。</div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>
function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
function go(){
  document.getElementById('out').innerHTML='<p class="meta">查询中…</p>';
  fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(j){
    document.getElementById('out').innerHTML='<div class="ans"><span class="ty">IPv4</span><pre>'+j.ip+'</pre></div>';
  }).catch(function(e){ document.getElementById('out').innerHTML='<p class="msg">查询失败：'+e+'（请检查网络或代理）</p>'; });
}
</script>
