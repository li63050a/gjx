<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>日期差计算 · 超能工具箱</title>
<script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<div class="container">
<a class="brand" href="../../index.html">🧰 超能工具箱</a>
<a class="back" href="../../index.html">← 返回主页</a>
<h2>📅 日期差计算</h2>
<div class="row">
<input type="date" id="d1"> <span class="meta">至</span>
<input type="date" id="d2">
<button class="btn" onclick="go()">计算相差</button>
</div>
<div id="out"></div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>
function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
function go(){
  var a=new Date(document.getElementById('d1').value), b=new Date(document.getElementById('d2').value);
  if(isNaN(a)||isNaN(b)){ document.getElementById('out').innerHTML='<p class="msg">请选择两个日期</p>'; return; }
  var days=Math.round(Math.abs(b-a)/86400000);
  var y=Math.floor(days/365), m=Math.floor((days%365)/30), w=Math.floor(days/7);
  document.getElementById('out').innerHTML='<div class="ans"><pre>相差 '+days+' 天\n约 '+w+' 周 / '+y+' 年 '+m+' 个月</pre></div>';
}
</script>
