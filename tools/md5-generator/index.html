<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 哈希 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; min-height:80px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; font-size:0.95rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔐 MD5 哈希</h2>
    <textarea id="md5Input" placeholder="输入要计算 MD5 的文本">hello world</textarea>
    <div class="flex">
        <button class="btn" onclick="calc()">🔢 计算 MD5</button>
        <button class="btn gray" onclick="clearMd5()">清空</button>
    </div>
    <div class="output-box" id="result">等待计算...</div>
</div>
<script>
    function md5(string) {
      function RotateLeft(lValue, iShiftBits) { return (lValue<<iShiftBits) | (lValue>>>(32-iShiftBits)); }
      function AddUnsigned(lX,lY) {
        var lX4,lY4,lX8,lY8,lResult;
        lX8 = (lX & 0x80000000); lY8 = (lY & 0x80000000);
        lX4 = (lX & 0x40000000); lY4 = (lY & 0x40000000);
        lResult = (lX & 0x3FFFFFFF)+(lY & 0x3FFFFFFF);
        if (lX4 & lY4) { return (lResult ^ 0x80000000 ^ lX8 ^ lY8); }
        if (lX4 | lY4) {
          if (lResult & 0x40000000) { return (lResult ^ 0xC0000000 ^ lX8 ^ lY8); }
          else { return (lResult ^ 0x40000000 ^ lX8 ^ lY8); }
        } else { return (lResult ^ lX8 ^ lY8); }
      }
      function F(x,y,z) { return (x & y) | ((~x) & z); }
      function G(x,y,z) { return (x & z) | (y & (~z)); }
      function H(x,y,z) { return (x ^ y ^ z); }
      function I(x,y,z) { return (y ^ (x | (~z))); }
      function FF(a,b,c,d,x,s,ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b,c,d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); }
      function GG(a,b,c,d,x,s,ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b,c,d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); }
      function HH(a,b,c,d,x,s,ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b,c,d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); }
      function II(a,b,c,d,x,s,ac) { a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b,c,d), x), ac)); return AddUnsigned(RotateLeft(a, s), b); }
      function ConvertToWordArray(string) {
        var lWordCount, lMessageLength = string.length, lNumberOfWords_temp1=lMessageLength + 8, lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64, lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16, lWordArray = new Array(lNumberOfWords-1), lBytePosition = 0, lByteCount = 0;
        while (lByteCount < lMessageLength) {
          lWordCount = (lByteCount - (lByteCount % 4)) / 4;
          lBytePosition = (lByteCount % 4) * 8;
          lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
          lByteCount++;
        }
        lWordCount = (lByteCount - (lByteCount % 4)) / 4;
        lBytePosition = (lByteCount % 4) * 8;
        lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
        lWordArray[lNumberOfWords-2] = lMessageLength << 3;
        lWordArray[lNumberOfWords-1] = lMessageLength >>> 29;
        return lWordArray;
      }
      function WordToHex(lValue) {
        var WordToHexValue="", WordToHexValue_temp="", lByte, lCount;
        for (lCount = 0; lCount<=3; lCount++) {
          lByte = (lValue >>> (lCount * 8)) & 255;
          WordToHexValue_temp = "0" + lByte.toString(16);
          WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length-2,2);
        }
        return WordToHexValue;
      }
      function Utf8Encode(string) {
        string = string.replace(/\r\n/g, "\n");
        var utftext = "";
        for (var n = 0; n < string.length; n++) {
          var c = string.charCodeAt(n);
          if (c < 128) { utftext += String.fromCharCode(c); }
          else if ((c > 127) && (c < 2048)) { utftext += String.fromCharCode((c >> 6) | 192); utftext += String.fromCharCode((c & 63) | 128); }
          else { utftext += String.fromCharCode((c >> 12) | 224); utftext += String.fromCharCode(((c >> 6) & 63) | 128); utftext += String.fromCharCode((c & 63) | 128); }
        }
        return utftext;
      }
      var k, AA, BB, CC, DD, a, b, c, d, S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
      var K = [0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391];
      string = Utf8Encode(string);
      x = ConvertToWordArray(string);
      a = 0x67452301; b = 0xefcdab89; c = 0x98badcfe; d = 0x10325476;
      for (k = 0; k < x.length; k += 16) {
        AA = a; BB = b; CC = c; DD = d;
        a = FF(a,b,c,d,x[k+0], S[0], K[0]);   d = FF(d,a,b,c,x[k+1], S[1], K[1]);   c = FF(c,d,a,b,x[k+2], S[2], K[2]);   b = FF(b,c,d,a,x[k+3], S[3], K[3]);
        a = FF(a,b,c,d,x[k+4], S[4], K[4]);   d = FF(d,a,b,c,x[k+5], S[5], K[5]);   c = FF(c,d,a,b,x[k+6], S[6], K[6]);   b = FF(b,c,d,a,x[k+7], S[7], K[7]);
        a = FF(a,b,c,d,x[k+8], S[8], K[8]);   d = FF(d,a,b,c,x[k+9], S[9], K[9]);   c = FF(c,d,a,b,x[k+10], S[10], K[10]); b = FF(b,c,d,a,x[k+11], S[11], K[11]);
        a = FF(a,b,c,d,x[k+12], S[12], K[12]); d = FF(d,a,b,c,x[k+13], S[13], K[13]); c = FF(c,d,a,b,x[k+14], S[14], K[14]); b = FF(b,c,d,a,x[k+15], S[15], K[15]);
        a = GG(a,b,c,d,x[k+1], S[16], K[16]); d = GG(d,a,b,c,x[k+6], S[17], K[17]); c = GG(c,d,a,b,x[k+11], S[18], K[18]); b = GG(b,c,d,a,x[k+0], S[19], K[19]);
        a = GG(a,b,c,d,x[k+5], S[20], K[20]); d = GG(d,a,b,c,x[k+10], S[21], K[21]); c = GG(c,d,a,b,x[k+15], S[22], K[22]); b = GG(b,c,d,a,x[k+4], S[23], K[23]);
        a = GG(a,b,c,d,x[k+9], S[24], K[24]); d = GG(d,a,b,c,x[k+14], S[25], K[25]); c = GG(c,d,a,b,x[k+3], S[26], K[26]); b = GG(b,c,d,a,x[k+8], S[27], K[27]);
        a = GG(a,b,c,d,x[k+13], S[28], K[28]); d = GG(d,a,b,c,x[k+2], S[29], K[29]); c = GG(c,d,a,b,x[k+7], S[30], K[30]); b = GG(b,c,d,a,x[k+12], S[31], K[31]);
        a = HH(a,b,c,d,x[k+5], S[32], K[32]); d = HH(d,a,b,c,x[k+8], S[33], K[33]); c = HH(c,d,a,b,x[k+11], S[34], K[34]); b = HH(b,c,d,a,x[k+14], S[35], K[35]);
        a = HH(a,b,c,d,x[k+1], S[36], K[36]); d = HH(d,a,b,c,x[k+4], S[37], K[37]); c = HH(c,d,a,b,x[k+7], S[38], K[38]); b = HH(b,c,d,a,x[k+10], S[39], K[39]);
        a = HH(a,b,c,d,x[k+13], S[40], K[40]); d = HH(d,a,b,c,x[k+0], S[41], K[41]); c = HH(c,d,a,b,x[k+3], S[42], K[42]); b = HH(b,c,d,a,x[k+6], S[43], K[43]);
        a = HH(a,b,c,d,x[k+9], S[44], K[44]); d = HH(d,a,b,c,x[k+12], S[45], K[45]); c = HH(c,d,a,b,x[k+15], S[46], K[46]); b = HH(b,c,d,a,x[k+2], S[47], K[47]);
        a = II(a,b,c,d,x[k+0], S[48], K[48]); d = II(d,a,b,c,x[k+7], S[49], K[49]); c = II(c,d,a,b,x[k+14], S[50], K[50]); b = II(b,c,d,a,x[k+5], S[51], K[51]);
        a = II(a,b,c,d,x[k+12], S[52], K[52]); d = II(d,a,b,c,x[k+3], S[53], K[53]); c = II(c,d,a,b,x[k+10], S[54], K[54]); b = II(b,c,d,a,x[k+1], S[55], K[55]);
        a = II(a,b,c,d,x[k+8], S[56], K[56]); d = II(d,a,b,c,x[k+15], S[57], K[57]); c = II(c,d,a,b,x[k+6], S[58], K[58]); b = II(b,c,d,a,x[k+13], S[59], K[59]);
        a = II(a,b,c,d,x[k+4], S[60], K[60]); d = II(d,a,b,c,x[k+11], S[61], K[61]); c = II(c,d,a,b,x[k+2], S[62], K[62]); b = II(b,c,d,a,x[k+9], S[63], K[63]);
        a = AddUnsigned(a, AA); b = AddUnsigned(b, BB); c = AddUnsigned(c, CC); d = AddUnsigned(d, DD);
      }
      return WordToHex(a) + WordToHex(b) + WordToHex(c) + WordToHex(d);
    }
    function calc() {
        var v = document.getElementById('md5Input').value;
        document.getElementById('result').textContent = md5(v);
    }
    function clearMd5() { document.getElementById('md5Input').value = ''; document.getElementById('result').textContent = '已清空'; }
</script>
</body>
