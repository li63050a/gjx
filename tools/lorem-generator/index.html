<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem 生成 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:300px; overflow-y:auto; font-size:0.9rem; line-height:1.6; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📝 Lorem 占位文本</h2>
    <div class="row">
        <span>段落数:</span><input type="text" id="paras" value="3">
        <span>每段句数:</span><input type="text" id="sents" value="5">
        <button class="btn" onclick="gen()">生成</button>
        <button class="btn gray" onclick="document.getElementById('result').textContent=''">清空</button>
    </div>
    <div class="output-box" id="result">等待生成...</div>
</div>
<script>
    var words = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur'.split(' ');
    function sentence() {
        var n = 5 + Math.floor(Math.random() * 8);
        var s = [];
        for (var i = 0; i < n; i++) s.push(words[Math.floor(Math.random() * words.length)]);
        var str = s.join(' ');
        return str.charAt(0).toUpperCase() + str.slice(1) + '.';
    }
    function gen() {
        var p = parseInt(document.getElementById('paras').value) || 1;
        var sn = parseInt(document.getElementById('sents').value) || 1;
        var out = [];
        for (var i = 0; i < p; i++) {
            var para = [];
            for (var j = 0; j < sn; j++) para.push(sentence());
            out.push(para.join(' '));
        }
        document.getElementById('result').textContent = out.join('\n\n');
    }
</script>
