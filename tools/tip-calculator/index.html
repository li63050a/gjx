<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小费分摊 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🍽️ 小费分摊</h2>
    <div class="row">
        <input type="text" id="bill" placeholder="账单金额" value="200">
        <input type="text" id="tip" placeholder="小费比例 %" value="15">
        <input type="text" id="people" placeholder="人数" value="3">
        <button class="btn" onclick="calc()">计算</button>
    </div>
    <div class="output-box" id="result">等待计算...</div>
</div>
<script>
    function calc() {
        var b = parseFloat(document.getElementById('bill').value);
        var t = parseFloat(document.getElementById('tip').value);
        var p = parseInt(document.getElementById('people').value) || 1;
        if (isNaN(b) || isNaN(t)) { document.getElementById('result').textContent = '请输入有效数值'; return; }
        var tipAmt = b * t / 100;
        var total = b + tipAmt;
        document.getElementById('result').innerHTML =
            '小费金额: ' + tipAmt.toFixed(2) + '<br>' +
            '总金额: ' + total.toFixed(2) + '<br>' +
            '人均支付: ' + (total / p).toFixed(2) + ' (共 ' + p + ' 人)';
    }
</script>

<!--SITE-LINKS-->
<div style="margin-top:28px;padding:14px 0;text-align:center;font-size:0.8rem;color:#94a3b8;border-top:1px solid #e2e8f0;">🔗 项目: <a href="https://github.com/li63050a/gjx" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">GitHub 仓库</a> · <a href="https://gjx.z321.cc.cd/" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">gjx.z321.cc.cd</a></div>
</body>
</html>
