<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大小写转换 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; min-height:100px; resize:vertical; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 18px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; font-size:0.85rem; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; max-height:150px; overflow-y:auto; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📝 大小写转换</h2>
    <textarea id="inputText" placeholder="输入文本">hello world! 你好世界</textarea>
    <div class="flex">
        <button class="btn" onclick="toUpper()">🔠 全大写</button>
        <button class="btn" onclick="toLower()">🔡 全小写</button>
        <button class="btn green" onclick="toTitle()">📌 首字母大写</button>
        <button class="btn gray" onclick="toCamel()">🐫 驼峰命名</button>
        <button class="btn gray" onclick="clearCase()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    const input = document.getElementById('inputText');
    const result = document.getElementById('result');
    function toUpper() { result.textContent = input.value.toUpperCase(); }
    function toLower() { result.textContent = input.value.toLowerCase(); }
    function toTitle() { result.textContent = input.value.replace(/\b\w/g, c => c.toUpperCase()); }
    function toCamel() {
        const words = input.value.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ');
        if (words.length === 0) { result.textContent = ''; return; }
        const camel = words[0] + words.slice(1).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
        result.textContent = camel;
    }
    function clearCase() { input.value = ''; result.textContent = '已清空'; }
</script>

</body>
</html>
