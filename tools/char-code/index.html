<title>字符码点查询 · 超能工具箱</title>
<script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<div class="container">
<a class="brand" href="../../index.html">🧰 超能工具箱</a>
<a class="back" href="../../index.html">← 返回主页</a>
<h2>🔣 字符码点查询</h2>
<div class="row"><input id="a" placeholder="输入字符，如 A 或 你"></div><div class="row"><button class="btn" onclick="go()">查询</button></div>
<div id="out"></div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
function go(){var s=document.getElementById('a').value;var r=Array.from(s).map(function(c){return c+' => U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');}).join(String.fromCharCode(10));document.getElementById('out').innerHTML='<div class="ans"><pre>'+esc(r)+'</pre></div>';}
</script>
