<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查找替换 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:120px; resize:vertical; font-family:monospace; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { flex:1; min-width:140px; padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; }
        .row label { display:flex; align-items:center; gap:4px; font-size:0.9rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:250px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔎 查找替换</h2>
    <textarea id="text" placeholder="输入文本">foo bar foo baz foo</textarea>
    <div class="row">
        <input type="text" id="find" placeholder="查找 (支持正则)" value="foo">
        <input type="text" id="repl" placeholder="替换为" value="FOO">
        <label><input type="checkbox" id="flagG" checked> g</label>
        <label><input type="checkbox" id="flagI"> i</label>
        <button class="btn" onclick="run()">替换</button>
    </div>
    <div class="flex" style="display:flex;gap:10px;margin:10px 0;">
        <button class="btn gray" onclick="document.getElementById('result').textContent=''">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function run() {
        var text = document.getElementById('text').value;
        var find = document.getElementById('find').value;
        var repl = document.getElementById('repl').value;
        if (!find) { document.getElementById('result').textContent = '请输入查找内容'; return; }
        var flags = '';
        if (document.getElementById('flagG').checked) flags += 'g';
        if (document.getElementById('flagI').checked) flags += 'i';
        try {
            var re = new RegExp(find, flags);
            var out = text.replace(re, repl);
            document.getElementById('result').textContent = out;
        } catch (e) {
            document.getElementById('result').textContent = '❌ 正则错误: ' + e.message;
        }
    }
</script>

</body>
</html>
