<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>文本转语音 · 超能工具箱</title>
<script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<div class="container">
<a class="brand" href="../../index.html">🧰 超能工具箱</a>
<a class="back" href="../../index.html">← 返回主页</a>
<h2>🔊 文本转语音 (TTS)</h2>
<div class="row"><textarea id="txt" rows="4" placeholder="输入要朗读的文本…"></textarea></div>
<div class="row">
<select id="voice"></select>
<label>语速 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
<label>音调 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></label>
</div>
<div class="row">
<button class="btn" onclick="speak()">🔊 朗读</button>
<button class="btn gray" onclick="stop()">停止</button>
</div>
<div id="out"></div>
<div class="note">使用浏览器内置语音合成（SpeechSynthesis），中文需系统/浏览器已安装中文语音包。</div>
</div>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>
function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}
if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}
var vs=[];
function loadVoices(){ vs=speechSynthesis.getVoices(); var sel=document.getElementById('voice'); sel.innerHTML=''; vs.forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o);}); }
loadVoices(); if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
function speak(){
  var u=new SpeechSynthesisUtterance(document.getElementById('txt').value);
  var v=vs[document.getElementById('voice').value];
  if(v) u.voice=v;
  u.rate=+document.getElementById('rate').value;
  u.pitch=+document.getElementById('pitch').value;
  speechSynthesis.speak(u);
  document.getElementById('out').innerHTML='<p class="meta">朗读中…</p>';
  u.onend=function(){ document.getElementById('out').innerHTML=''; };
}
function stop(){ speechSynthesis.cancel(); document.getElementById('out').innerHTML=''; }
</script>
