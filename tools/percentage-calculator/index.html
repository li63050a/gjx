<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百分比计算 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📊 百分比计算</h2>
    <div class="row">
        <input type="text" id="pA" placeholder="数值 A" value="25">
        <input type="text" id="pB" placeholder="基数 B" value="200">
        <button class="btn" onclick="calcPct()">A 占 B 的百分比</button>
    </div>
    <div class="row">
        <input type="text" id="pVal" placeholder="基数" value="100">
        <input type="text" id="pPct" placeholder="百分比 %" value="15">
        <button class="btn" onclick="calcInc()">增加</button>
        <button class="btn" onclick="calcDec()">减少</button>
    </div>
    <div class="output-box" id="result">等待计算...</div>
</div>
<script>
    function calcPct() {
        var a = parseFloat(document.getElementById('pA').value), b = parseFloat(document.getElementById('pB').value);
        if (isNaN(a) || isNaN(b) || b === 0) { document.getElementById('result').textContent = '请输入有效数值'; return; }
        document.getElementById('result').innerHTML = a + ' 是 ' + b + ' 的 <b>' + (a/b*100).toFixed(2) + '%</b>';
    }
    function calcInc() {
        var v = parseFloat(document.getElementById('pVal').value), p = parseFloat(document.getElementById('pPct').value);
        if (isNaN(v) || isNaN(p)) { document.getElementById('result').textContent = '请输入有效数值'; return; }
        document.getElementById('result').innerHTML = v + ' 增加 ' + p + '% = <b>' + (v*(1+p/100)).toFixed(2) + '</b>';
    }
    function calcDec() {
        var v = parseFloat(document.getElementById('pVal').value), p = parseFloat(document.getElementById('pPct').value);
        if (isNaN(v) || isNaN(p)) { document.getElementById('result').textContent = '请输入有效数值'; return; }
        document.getElementById('result').innerHTML = v + ' 减少 ' + p + '% = <b>' + (v*(1-p/100)).toFixed(2) + '</b>';
    }
</script>

</body>
</html>
