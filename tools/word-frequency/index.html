<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词频统计 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:120px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:280px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📈 词频统计</h2>
    <textarea id="text" placeholder="粘贴一段文本">apple banana Apple cherry banana apple Cherry</textarea>
    <div class="flex">
        <button class="btn" onclick="count()">📊 统计</button>
        <label style="align-self:center;font-size:0.9rem;"><input type="checkbox" id="ci" checked> 忽略大小写</label>
        <button class="btn gray" onclick="document.getElementById('result').textContent=''">清空</button>
    </div>
    <div class="output-box" id="result">等待统计...</div>
</div>
<script>
    function count() {
        var text = document.getElementById('text').value;
        var ci = document.getElementById('ci').checked;
        var words = text.replace(/[^\w\s\u4e00-\u9fa5]/g, ' ').split(/\s+/).filter(Boolean);
        var map = {};
        for (var i = 0; i < words.length; i++) {
            var w = ci ? words[i].toLowerCase() : words[i];
            map[w] = (map[w] || 0) + 1;
        }
        var arr = [];
        for (var k in map) arr.push([k, map[k]]);
        arr.sort(function(a, b){ return b[1] - a[1]; });
        var out = '总词数: ' + words.length + '，不同词: ' + arr.length + '\n\n';
        for (var j = 0; j < arr.length; j++) out += arr[j][0] + ': ' + arr[j][1] + '\n';
        document.getElementById('result').textContent = out;
    }
</script>
</body>
</html>
