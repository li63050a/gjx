<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <title>JS 压缩 / 混淆 · 超能工具箱</title>
    <script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#f1f5f9; padding:20px; color:#0f172a; }
        .container { max-width:900px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:14px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row select { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        textarea { width:100%; min-height:160px; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-family:monospace; font-size:0.85rem; resize:vertical; }
        .msg { margin-top:10px; font-size:0.9rem; color:#64748b; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        @media (max-width:680px){ .grid2 { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🌀 JS 压缩 / 混淆</h2>
    <div class="row">
        <select id="mode"><option value="min">压缩（去注释/空白）</option><option value="obf">混淆（压缩 + 字符串转义）</option></select>
        <button class="btn" onclick="run()">转换</button>
        <button class="btn gray" onclick="copyOut()">复制结果</button>
        <button class="btn gray" onclick="downloadOut()">下载 .min.js</button>
    </div>
    <div class="grid2">
        <div><div class="msg">原始代码</div><textarea id="src" placeholder="粘贴 JavaScript 代码">function greet(name){ // 打招呼\n  var msg = 'Hello, ' + name + '!'; // 生成消息\n  return\n    msg;\n}\nconsole.log(greet('World'));</textarea></div>
        <div><div class="msg">输出结果</div><textarea id="out" readonly placeholder="结果将显示在这里"></textarea></div>
    </div>
    <div class="msg" id="msg">纯前端处理，代码不会上传。混淆仅做字符串转义，变量名不重命名（保证安全）。</div>
</div>
<script>
    function isWord(ch){ return /[A-Za-z0-9_$]/.test(ch); }
    function minify(code, confuse){
        var out='', i=0, n=code.length, inS=0;
        while(i<n){
            var c=code[i];
            if(inS){
                if(c==='\\'){ out+=c+code[i+1]; i+=2; continue; }
                if(confuse && (inS===1||inS===2)){
                    var cc=c.charCodeAt(0);
                    if(c==='\n'){ out+='\\n'; i++; continue; }
                    if(cc<0x80 && c!=='\'' && c!=='"'){ out+='\\x'+('0'+cc.toString(16)).slice(-2); }
                    else if(cc>=0x80){ out+='\\u'+('000'+cc.toString(16)).slice(-4); }
                    else out+=c;
                } else out+=c;
                if((inS===1&&c==="'")||(inS===2&&c==='"')||(inS===3&&c==='`')) inS=0;
                i++; continue;
            }
            if(c==='/'&&code[i+1]==='/'){ while(i<n&&code[i]!=='\n') i++; continue; }
            if(c==='/'&&code[i+1]==='*'){ i+=2; while(i<n&&!(code[i]==='*'&&code[i+1]==='/')) i++; i+=2; continue; }
            if(c==='\''||c==='"'||c==='`'){ inS = c==="'"?1:(c==='"'?2:3); out+=c; i++; continue; }
            if(c===' '||c==='\t'||c==='\r'||c==='\n'){
                if(out===''||/\s/.test(out.slice(-1))){ i++; continue; }
                if(isWord(out.slice(-1)) && isWord(code[i+1])) out+=' ';
                i++; continue;
            }
            out+=c; i++;
        }
        return out;
    }
    function run(){
        var src=document.getElementById('src').value;
        var mode=document.getElementById('mode').value;
        try{
            var res=minify(src, mode==='obf');
            document.getElementById('out').value=res;
            var before=src.length, after=res.length;
            document.getElementById('msg').textContent='完成：'+before+' → '+after+' 字符（减少 '+((before-after)/before*100||0).toFixed(0)+'%）';
        }catch(e){ document.getElementById('msg').textContent='错误：'+e.message; }
    }
    function copyOut(){ var o=document.getElementById('out'); o.select(); document.execCommand('copy'); document.getElementById('msg').textContent='已复制结果'; }
    function downloadOut(){ var a=document.createElement('a'); a.download='app.min.js'; a.href='data:text/javascript;charset=utf-8,'+encodeURIComponent(document.getElementById('out').value); a.click(); }
</script>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:#2563eb;color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}</script>
