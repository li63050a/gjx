<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本行处理 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:150px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
        .btn { padding:6px 16px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; font-size:0.85rem; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.orange { background:#f59e0b; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.85rem; font-family:monospace; white-space:pre-wrap; max-height:250px; overflow-y:auto; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📝 文本行处理</h2>
    <textarea id="textInput" placeholder="每行一个条目">banana
apple
apple
cherry
date</textarea>
    <div class="flex">
        <button class="btn" onclick="sortLines()">🔤 排序</button>
        <button class="btn green" onclick="dedupLines()">🧹 去重</button>
        <button class="btn orange" onclick="reverseLines()">🔃 反转</button>
        <button class="btn" onclick="trimLines()">✂️ 去空行</button>
        <button class="btn gray" onclick="clearText()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    const input = document.getElementById('textInput');
    const result = document.getElementById('result');

    function getLines() { return input.value.split('\n'); }
    function setLines(lines) { result.textContent = lines.join('\n'); }

    function sortLines() {
        const lines = getLines().filter(l => l.trim() !== '');
        setLines(lines.sort());
    }
    function dedupLines() {
        const lines = getLines().filter(l => l.trim() !== '');
        const seen = {};
        const unique = lines.filter(l => { if (seen[l]) return false; seen[l]=true; return true; });
        setLines(unique);
    }
    function reverseLines() {
        const lines = getLines().filter(l => l.trim() !== '');
        setLines(lines.reverse());
    }
    function trimLines() {
        const lines = getLines().filter(l => l.trim() !== '');
        setLines(lines);
    }
    function clearText() { input.value = ''; result.textContent = '已清空'; }
</script>

<!--SITE-LINKS-->

</body>
</html>
