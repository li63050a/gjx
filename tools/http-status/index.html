<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP 状态码 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:120px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.9rem; max-height:320px; overflow-y:auto; }
        .item { padding:6px 0; border-bottom:1px solid #eef2f7; }
        .code { font-weight:700; color:#2563eb; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🌐 HTTP 状态码速查</h2>
    <div class="row">
        <input type="text" id="q" placeholder="搜索状态码或关键词" oninput="search()">
    </div>
    <div class="output-box" id="result"></div>
</div>
<script>
    var codes = [
        [100,'Continue','继续'], [101,'Switching Protocols','切换协议'],
        [200,'OK','成功'], [201,'Created','已创建'], [202,'Accepted','已接受'], [204,'No Content','无内容'],
        [301,'Moved Permanently','永久重定向'], [302,'Found','临时重定向'], [304,'Not Modified','未修改'],
        [400,'Bad Request','请求错误'], [401,'Unauthorized','未授权'], [403,'Forbidden','禁止访问'], [404,'Not Found','未找到'], [405,'Method Not Allowed','方法不允许'], [408,'Request Timeout','请求超时'], [429,'Too Many Requests','请求过多'],
        [500,'Internal Server Error','服务器内部错误'], [502,'Bad Gateway','网关错误'], [503,'Service Unavailable','服务不可用'], [504,'Gateway Timeout','网关超时']
    ];
    function search() {
        var q = document.getElementById('q').value.trim().toLowerCase();
        var html = '';
        for (var i = 0; i < codes.length; i++) {
            if (!q || ('' + codes[i][0]).indexOf(q) > -1 || codes[i][1].toLowerCase().indexOf(q) > -1 || codes[i][2].indexOf(q) > -1) {
                html += '<div class="item"><span class="code">' + codes[i][0] + '</span> ' + codes[i][1] + ' — ' + codes[i][2] + '</div>';
            }
        }
        document.getElementById('result').innerHTML = html || '无匹配';
    }
    search();
</script>

</body>
</html>
