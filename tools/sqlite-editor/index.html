<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <title>SQLite 数据库编辑器 · 超能工具箱</title>
    <script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;</script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#f1f5f9; padding:20px; color:#0f172a; }
        .container { max-width:900px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:14px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .btn { padding:8px 18px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .btn.green { background:#16a34a; }
        textarea { width:100%; min-height:140px; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-family:monospace; font-size:0.9rem; resize:vertical; }
        .msg { margin-top:10px; font-size:0.9rem; color:#b91c1c; white-space:pre-wrap; }
        .tables { margin-top:10px; }
        .tables .t { display:inline-block; background:#eef2ff; color:#4338ca; padding:5px 12px; border-radius:16px; margin:4px; font-size:0.85rem; cursor:pointer; }
        .res { margin-top:14px; overflow-x:auto; }
        table.sql { border-collapse:collapse; margin:10px 0; font-size:0.85rem; }
        table.sql th, table.sql td { border:1px solid #e2e8f0; padding:6px 10px; text-align:left; max-width:300px; overflow:hidden; text-overflow:ellipsis; }
        table.sql th { background:#eef2ff; color:#3730a3; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🗄️ SQLite 数据库编辑器 (.db)</h2>
    <div class="row">
        <button class="btn green" onclick="newDb()">新建数据库</button>
        <label class="btn gray">打开 .db 文件<input id="file" type="file" accept=".db,.sqlite,.sqlite3" style="display:none" onchange="openFile()"></label>
        <button class="btn" onclick="runSql()">运行 SQL</button>
        <button class="btn gray" onclick="listTables()">列出表</button>
        <button class="btn gray" onclick="exportDb()">导出数据库</button>
    </div>
    <textarea id="sql" placeholder="输入 SQL，如：CREATE TABLE t(id INTEGER, name TEXT); INSERT INTO t VALUES(1,'a'); SELECT * FROM t;">CREATE TABLE t(id INTEGER, name TEXT);
INSERT INTO t VALUES(1,'苹果'),(2,'香蕉');
SELECT * FROM t;</textarea>
    <div class="tables" id="tables"></div>
    <div class="res" id="res"></div>
    <div class="msg" id="msg"></div>
    <p class="msg" style="color:#64748b">提示：全部在浏览器本地运行（sql.js/WASM），数据不上传。导出为 .sqlite 文件。</p>
</div>
<script src="../../js/sql-wasm.js"></script>
<script>
    var SQL = null, db = null, dbName = 'database.sqlite';
    function setMsg(m, ok){ var el=document.getElementById('msg'); el.textContent = m || ''; el.style.color = ok ? '#16a34a' : '#b91c1c'; }
    initSqlJs({ locateFile: function(f){ return '../../js/' + f; } }).then(function(s){ SQL = s; db = new SQL.Database(); setMsg('SQLite 引擎已就绪，已新建空数据库。', true); });

    function ensureDb(){ if(!SQL) { setMsg('引擎仍在加载，请稍候…'); return false; } if(!db) db = new SQL.Database(); return true; }
    function newDb(){ if(!ensureDb()) return; db.close(); db = new SQL.Database(); dbName='database.sqlite'; setMsg('已新建空数据库。', true); renderTables(['（空数据库，建表后可见）']); document.getElementById('res').innerHTML=''; }
    function openFile(){
        var f = document.getElementById('file').files[0]; if(!f) return;
        if(!SQL){ setMsg('引擎仍在加载…'); return; }
        var reader = new FileReader();
        reader.onload = function(e){ try { db = new SQL.Database(new Uint8Array(e.target.result)); dbName = f.name; setMsg('已打开：'+f.name, true); listTables(); } catch(err){ setMsg('打开失败：'+err.message); } };
        reader.readAsArrayBuffer(f);
    }
    function runSql(){
        if(!ensureDb()) return;
        var sql = document.getElementById('sql').value.trim(); if(!sql){ setMsg('请输入 SQL'); return; }
        try {
            var results = db.exec(sql);
            var html = '';
            if(!results.length){ html = '<p class="msg" style="color:#16a34a">执行成功，无返回结果集。</p>'; }
            results.forEach(function(r){
                html += '<table class="sql"><thead><tr>' + r.columns.map(function(c){ return '<th>'+c+'</th>'; }).join('') + '</tr></thead><tbody>'
                    + r.values.map(function(row){ return '<tr>' + row.map(function(v){ return '<td>'+(v===null?'<i>NULL</i>':String(v))+'</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
            });
            document.getElementById('res').innerHTML = html || '<p class="msg" style="color:#16a34a">完成。</p>';
            setMsg('执行成功。', true);
            listTables();
        } catch(err){ setMsg('SQL 错误：'+err.message); }
    }
    function listTables(){
        if(!ensureDb()) return;
        try {
            var res = db.exec("SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name;");
            var names = res.length ? res[0].values.map(function(v){ return v[0]; }) : [];
            renderTables(names);
        } catch(err){ setMsg('列出表失败：'+err.message); }
    }
    function renderTables(names){
        var box = document.getElementById('tables');
        if(!names.length){ box.innerHTML = '<span class="t">（暂无表）</span>'; return; }
        box.innerHTML = names.map(function(n){ return '<span class="t" onclick="fillSelect(\''+String(n).replace(/'/g,"\\'")+'\')">'+n+'</span>'; }).join('');
    }
    function fillSelect(t){ document.getElementById('sql').value = 'SELECT * FROM '+t+' LIMIT 100;'; runSql(); }
    function exportDb(){
        if(!ensureDb()) return;
        try {
            var data = db.export();
            var blob = new Blob([data], { type:'application/x-sqlite3' });
            var a = document.createElement('a'); a.download = dbName; a.href = URL.createObjectURL(blob); a.click();
            setMsg('已导出 '+dbName, true);
        } catch(err){ setMsg('导出失败：'+err.message); }
    }
</script>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:#2563eb;color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}</script>

</body>
</html>
