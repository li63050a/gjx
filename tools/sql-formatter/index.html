<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL 格式化 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:120px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:250px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🗄️ SQL 格式化</h2>
    <textarea id="sql" placeholder="粘贴 SQL">select id,name from users where age>18 order by name;</textarea>
    <div class="flex">
        <button class="btn" onclick="fmt()">✨ 格式化</button>
        <button class="btn gray" onclick="document.getElementById('sql').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function fmt() {
        var sql = document.getElementById('sql').value;
        var kws = ['select','from','where','and','or','order by','group by','having','insert into','update','delete','set','values','left join','right join','inner join','join','on','limit','offset','union','create table','alter table','drop table'];
        var s = sql.replace(/\s+/g, ' ').trim();
        for (var i = 0; i < kws.length; i++) {
            var re = new RegExp('\\b' + kws[i].replace(' ', '\\s+') + '\\b', 'gi');
            s = s.replace(re, '\n' + kws[i].toUpperCase());
        }
        s = s.replace(/\n+/g, '\n').replace(/^\n/, '');
        document.getElementById('result').textContent = s;
    }
</script>

</body>
</html>
