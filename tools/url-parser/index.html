<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 解析 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:80px; resize:vertical; font-family:monospace; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; font-size:0.9rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🌐 URL 解析</h2>
    <textarea id="url" placeholder="粘贴一个完整 URL">https://user:pass@example.com:8080/path/to/page?a=1&b=2#section</textarea>
    <div class="flex" style="display:flex;gap:10px;margin:10px 0;">
        <button class="btn" onclick="parse()">解析</button>
        <button class="btn gray" onclick="document.getElementById('url').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待解析...</div>
</div>
<script>
    function parse() {
        var u = document.getElementById('url').value.trim();
        try {
            var a = new URL(u);
            var params = [];
            a.searchParams.forEach(function(v, k){ params.push(k + ' = ' + v); });
            var out =
                '协议 protocol: ' + a.protocol + '\n' +
                '主机 host: ' + a.host + '\n' +
                '主机名 hostname: ' + a.hostname + '\n' +
                '端口 port: ' + (a.port || '(默认)') + '\n' +
                '用户名 username: ' + (a.username || '(无)') + '\n' +
                '密码 password: ' + (a.password ? '******' : '(无)') + '\n' +
                '路径 pathname: ' + a.pathname + '\n' +
                '查询 query: ' + a.search + '\n' +
                '参数 params:\n  ' + (params.join('\n  ') || '(无)') + '\n' +
                '哈希 hash: ' + a.hash;
            document.getElementById('result').textContent = out;
        } catch (e) {
            document.getElementById('result').textContent = '❌ 无效 URL: ' + e.message;
        }
    }
</script>

</body>
</html>
