<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slug 生成 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        input[type=text] { width:100%; padding:10px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; font-size:1rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔗 URL Slug 生成</h2>
    <input type="text" id="text" placeholder="输入标题" value="Hello 世界! How are you?">
    <div class="flex" style="display:flex;gap:10px;margin:10px 0;">
        <button class="btn" onclick="gen()">生成</button>
        <button class="btn gray" onclick="document.getElementById('text').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待生成...</div>
</div>
<script>
    function gen() {
        var t = document.getElementById('text').value.toLowerCase().trim();
        t = t.replace(/[\u4e00-\u9fa5]/g, ''); // 移除中文(可保留如需)
        t = t.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        document.getElementById('result').textContent = t || '(空)';
    }
</script>
</body>
</html>
