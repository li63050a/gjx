<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情符号 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:8px; }
        .emoji { font-size:1.6rem; text-align:center; padding:8px; border:1px solid #e2e8f0; border-radius:10px; cursor:pointer; background:#fff; }
        .emoji:active { transform:scale(0.9); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:1.2rem; word-break:break-all; min-height:24px; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>😀 表情符号速选</h2>
    <div class="grid" id="grid"></div>
    <div class="output-box" id="result">点击上方表情复制到此处</div>
</div>
<script>
    var list = '😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😙 😋 😛 😜 🤪 😝 🤑 🤗 🤭 🤫 🤔 😐 😑 😶 😏 😒 🙄 😬 🤥 😌 😔 😪 🤤 😴 😷 🤒 🤕 🥶 🥵 🥴 😎 🤓 🧐 🤠 🥳 😎 🤖 👍 👎 👌 ✌️ 🤞 ✊ ✋ 🤚 🖐️ 👏 🙌 🙏 💪 🦾 🧠 👀 🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🦆 🦅 🐺 🐗 🦄 🐝 🦋 🐢 🐍 🐙 🐳 🐬 🌸 🌺 🌻 🌹 🌷 🌲 🌳 🍎 🍊 🍋 🍉 🍇 🍓 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🍔 🍟 🍕 🌭 🌮 🍿 🍩 🍪 🎂 🍰 🍫 🍬 🍭 🍮 ☕ 🍵 🍺 🍻 🥂 🍷 🍸 🥤 ⚽ 🏀 🏈 ⚾ 🎾 🏐 🎱 🏓 🥅 🎯 🎲 🎲 🎮 🎸 🎺 🎻 🥁 🚗 🚕 🚙 🚌 🚓 🚑 🚒 🏍️ 🚲 🛴 ✈️ 🚀 🛸 🚁 ⭐ 🌟 💫 ✨ ⚡ 🔥 🌈 ☀️ 🌙 ☁️ 💧 🌊 🍀 🌍 🌝 🌞 💡 🔧 🔨 🔑 💡 📱 💻 ⌨️ 🖥️ 🖨️ 💾 💿 🔋 🔌 🎉 🎊 🎁 🏆 🥇 🥈 🥉 💎 💰 💵 💴 💳 🔔 💡 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 🌟 💯 ✅ ❌ ⭕ 🔴 🟠 🟡 🟢 🔵 🟣 ⚫ ⚪ 🟤 🔺 🔻 🔶 🔷 🔸 🔹'.split(' ');
    var grid = document.getElementById('grid');
    for (var i = 0; i < list.length; i++) {
        if (!list[i]) continue;
        var d = document.createElement('div');
        d.className = 'emoji'; d.textContent = list[i];
        d.title = '点击复制';
        d.onclick = (function(e){ return function(){ document.getElementById('result').textContent = e; if(navigator.clipboard) navigator.clipboard.writeText(e); else if(window.clipboardData) window.clipboardData.setData('Text', e); }; })(list[i]);
        grid.appendChild(d);
    }
</script>
</body>
</html>
