<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, scale=1.0">
    <title>文本反转 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:100px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
        .btn { padding:6px 16px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; font-size:0.85rem; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:220px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔃 文本反转</h2>
    <textarea id="text" placeholder="输入文本">Hello World</textarea>
    <div class="flex">
        <button class="btn" onclick="revChars()">反转字符</button>
        <button class="btn" onclick="revWords()">反转单词</button>
        <button class="btn" onclick="revLines()">反转行</button>
        <button class="btn gray" onclick="document.getElementById('text').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function set(s){ document.getElementById('result').textContent = s; }
    function revChars(){ set(document.getElementById('text').value.split('').reverse().join('')); }
    function revWords(){ set(document.getElementById('text').value.split(/\s+/).reverse().join(' ')); }
    function revLines(){ set(document.getElementById('text').value.split('\n').reverse().join('\n')); }
</script>
</body>
</html>
