<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面积换算 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input, .row select { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🟦 面积换算</h2>
    <div class="row">
        <input type="text" id="val" placeholder="输入数值" value="1">
        <select id="unit">
            <option value="mm2">平方毫米 mm²</option>
            <option value="cm2">平方厘米 cm²</option>
            <option value="m2" selected>平方米 m²</option>
            <option value="km2">平方千米 km²</option>
            <option value="ha">公顷 ha</option>
            <option value="acre">英亩 acre</option>
            <option value="ft2">平方英尺 ft²</option>
        </select>
        <button class="btn" onclick="conv()">换算</button>
    </div>
    <div class="output-box" id="result">等待换算...</div>
</div>
<script>
    var f = { mm2:0.000001, cm2:0.0001, m2:1, km2:1000000, ha:10000, acre:4046.86, ft2:0.092903 };
    function conv() {
        var v = parseFloat(document.getElementById('val').value);
        var u = document.getElementById('unit').value;
        if (isNaN(v)) { document.getElementById('result').textContent = '请输入有效数值'; return; }
        var base = v * f[u];
        var out = [];
        for (var k in f) { out.push(k + ': ' + (base / f[k]).toFixed(6).replace(/\.?0+$/, '')); }
        document.getElementById('result').innerHTML = out.join('<br>');
    }
</script>
</body>
</html>
