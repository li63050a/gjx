<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闰年判断 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { flex:1; min-width:120px; padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:1.2rem; text-align:center; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🗓️ 闰年判断</h2>
    <div class="row">
        <input type="text" id="y" placeholder="输入年份" value="2024">
        <button class="btn" onclick="check()">判断</button>
    </div>
    <div class="output-box" id="result">等待判断...</div>
</div>
<script>
    function check() {
        var y = parseInt(document.getElementById('y').value);
        if (isNaN(y)) { document.getElementById('result').textContent='请输入年份'; return; }
        var leap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        document.getElementById('result').textContent = y + ' 年 ' + (leap ? '是闰年 ✅ (366天)' : '不是闰年 ❌ (365天)');
    }
</script>

<!--SITE-LINKS-->

</body>
</html>
