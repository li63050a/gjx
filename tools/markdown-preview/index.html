<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.85rem; min-height:110px; resize:vertical; font-family:monospace; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .preview { background:#f8fafc; padding:16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; max-height:320px; overflow-y:auto; font-size:0.9rem; line-height:1.7; }
        .preview h1 { font-size:1.6rem; } .preview h2 { font-size:1.3rem; } .preview code { background:#e2e8f0; padding:1px 5px; border-radius:4px; }
        .preview pre { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; overflow-x:auto; }
        .preview a { color:#2563eb; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📄 Markdown 预览</h2>
    <textarea id="md" placeholder="支持 #, ##, **粗体**, *斜体*, `代码`, - 列表, [链接](url)"># 标题
这是 **粗体** 和 *斜体* 还有 `代码`。

- 项目一
- 项目二

访问 [示例](https://example.com)</textarea>
    <div class="flex" style="display:flex;gap:10px;margin:10px 0;">
        <button class="btn" onclick="render()">预览</button>
        <button class="btn gray" onclick="document.getElementById('md').value=''">清空</button>
    </div>
    <div class="preview" id="result"></div>
</div>
<script>
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function render() {
        var t = document.getElementById('md').value;
        var lines = t.split('\n'), html = '', inCode = false, listOpen = false;
        function closeList(){ if (listOpen) { html += '</ul>'; listOpen = false; } }
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (/^```/.test(line)) { if (inCode){ html += '</code></pre>'; inCode=false; } else { closeList(); html += '<pre><code>'; inCode=true; } continue; }
            if (inCode) { html += esc(line) + '\n'; continue; }
            if (/^# /.test(line)) { closeList(); html += '<h1>' + inline(line.substr(2)) + '</h1>'; }
            else if (/^## /.test(line)) { closeList(); html += '<h2>' + inline(line.substr(3)) + '</h2>'; }
            else if (/^[-*] /.test(line)) { if (!listOpen){ html += '<ul>'; listOpen=true; } html += '<li>' + inline(line.substr(2)) + '</li>'; }
            else if (line.trim() === '') { closeList(); }
            else { closeList(); html += '<p>' + inline(line) + '</p>'; }
        }
        if (inCode) html += '</code></pre>';
        closeList();
        document.getElementById('result').innerHTML = html;
    }
    function inline(s) {
        s = esc(s);
        s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
        s = s.replace(/`(.+?)`/g, '<code>$1</code>');
        s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
        return s;
    }
    render();
</script>
</body>
</html>
