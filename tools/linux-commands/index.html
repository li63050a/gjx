  { name:'awk', desc:'强大的文本处理与报表工具，按列处理数据。', syntax:'awk [选项] \'模式{动作}\' 文件',
    opts:[['{print $1}','打印第1列'],['-F,','指定分隔符为逗号'],['NR','当前行号'],['END{}','处理完执行'],['$0','整行']],
    ex:['awk -F: \'{print $1}\' /etc/passwd        # 打印所有用户名','awk \'{s+=$1} END{print s}\' d.txt    # 求和'] },
  { name:'vim / nano', desc:'终端文本编辑器。vim 功能强但需学习；nano 简单易用。', syntax:'vim 文件 / nano 文件',
    opts:[['vim i','进入插入模式'],['vim :wq','保存退出'],['vim :q!','不保存退出'],['nano Ctrl+O','保存'],['nano Ctrl+X','退出']],
    ex:['vim config.conf        # 编辑文件','nano notes.txt         # 简易编辑'] },
  { name:'chmod 数字法', desc:'权限数字由 r=4、w=2、x=1 相加。三位分别对应 所有者/组/其他。', syntax:'chmod ABC 文件',
    opts:[['7=4+2+1','读+写+执行 (rwx)'],['6=4+2','读+写 (rw-)'],['5=4+1','读+执行 (r-x)'],['4','只读 (r--)'],['0','无权限 (---)']],
    ex:['chmod 644 file        # rw-r--r--','chmod 600 key.pem     # 仅所有者可读写'] },
  { name:'useradd / passwd', desc:'创建用户与设置密码。', syntax:'useradd 用户名 / passwd 用户名',
    opts:[['-m','创建家目录'],['-s','指定登录 shell'],['-G','附加组'],['passwd -l','锁定账户'],['passwd -d','清空密码']],
    ex:['useradd -m -s /bin/bash tom        # 建用户','passwd tom                        # 设密码'] },
  { name:'sudo / su', desc:'以更高权限执行命令。sudo 临时提权，su 切换用户（默认 root）。', syntax:'sudo 命令 / su [用户]',
    opts:[['sudo -i','切换到 root 交互 shell'],['su -','切换并加载目标环境'],['sudo -u','以指定用户执行']],
    ex:['sudo apt update        # 以 root 执行','su -                # 切到 root'] },
  { name:'ln', desc:'创建链接。默认硬链接；-s 创建符号链接（类似快捷方式）。', syntax:'ln [选项] 源 链接名',
    opts:[['-s','符号链接（软链接）'],['-f','强制覆盖'],['-n','不跟随已存在的链接']],
    ex:['ln -s /data/app /opt/app        # 建软链接'] },
  { name:'echo', desc:'输出文本或变量，常配合重定向或管道使用。', syntax:'echo [选项] 文本',
    opts:[['-n','不换行'],['-e','解释转义符（\\n \\t）'],['$变量','输出环境变量值']],
    ex:['echo $PATH            # 打印路径','echo "hi" > f.txt      # 写入文件'] },
];

function renderList(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var box = document.getElementById('chips'); box.innerHTML='';
  var matched = CMDS.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q)>-1 || c.desc.toLowerCase().indexOf(q)>-1; });
  if(!matched.length){ box.innerHTML='<span class="empty">未找到相关命令</span>'; return; }
  matched.forEach(function(c){
    var b=document.createElement('button'); b.className='chip'; b.textContent=c.name;
    b.onclick=function(){ showDetail(c.name); };
    box.appendChild(b);
  });
}
function showDetail(name){
  var c = CMDS.filter(function(x){return x.name===name;})[0]; if(!c) return;
  var h = '<h3>'+c.name+'</h3><div class="desc">'+c.desc+'</div>';
  h += '<h4>基本语法</h4><pre>'+c.syntax+'</pre>';
  h += '<h4>常用选项</h4><table><tr><th>选项</th><th>说明</th></tr>';
  c.opts.forEach(function(o){ h += '<tr><td><code>'+o[0]+'</code></td><td>'+o[1]+'</td></tr>'; });
  h += '</table><h4>常见示例</h4>';
  c.ex.forEach(function(e){ h += '<pre>'+e+'</pre>'; });
  var d=document.getElementById('detail'); d.innerHTML=h; d.classList.add('show');
  document.getElementById('empty').style.display='none';
}
renderList();
</script>
