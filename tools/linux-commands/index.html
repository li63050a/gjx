function renderList(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var box = document.getElementById("chips"); box.innerHTML="";
  var m = CMDS.filter(function(c){ return !q || c.n.toLowerCase().indexOf(q)>-1 || c.d.toLowerCase().indexOf(q)>-1; });
  if(!m.length){ box.innerHTML='<span class="empty">未找到相关命令</span>'; return; }
  m.forEach(function(c){ var b=document.createElement("button"); b.className="chip"; b.textContent=c.n; b.onclick=function(){ showDetail(c.n); }; box.appendChild(b); });
}
function showDetail(name){
  var c = CMDS.filter(function(x){return x.n===name;})[0]; if(!c) return;
  var h = "<h3>"+c.n+"</h3><div class=\"desc\">"+c.d+"</div>";
  h += "<h4>基本语法</h4><pre>"+c.s+"</pre>";
  h += "<h4>常用选项</h4><table><tr><th>选项</th><th>说明</th></tr>";
  c.o.forEach(function(x){ if(x[0]) h += "<tr><td><code>"+x[0]+"</code></td><td>"+x[1]+"</td></tr>"; });
  h += "</table><h4>常见示例</h4>";
  c.e.forEach(function(e){ h += "<pre>"+e+"</pre>"; });
  var d=document.getElementById("detail"); d.innerHTML=h; d.classList.add("show");
  document.getElementById("empty").style.display="none";
}
renderList();
