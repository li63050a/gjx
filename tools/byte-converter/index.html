<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字节换算 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input, .row select { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📦 字节单位换算</h2>
    <div class="row">
        <input type="text" id="byteInput" placeholder="输入数值" value="1024">
        <select id="byteUnit">
            <option value="B">B (字节)</option>
            <option value="KB">KB</option>
            <option value="MB">MB</option>
            <option value="GB">GB</option>
            <option value="TB">TB</option>
        </select>
        <button class="btn" onclick="convertByte()">换算</button>
    </div>
    <div class="output-box" id="result">等待换算...</div>
</div>
<script>
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const factor = 1024;
    function convertByte() {
        const val = parseFloat(document.getElementById('byteInput').value);
        const unit = document.getElementById('byteUnit').value;
        if (isNaN(val) || val < 0) { document.getElementById('result').textContent = '请输入有效正数'; return; }
        const idx = units.indexOf(unit);
        let bytes = val * Math.pow(factor, idx);
        let lines = [];
        for (let i=0; i<units.length; i++) {
            let v = bytes / Math.pow(factor, i);
            if (i === 0) lines.push(units[i] + ': ' + v);
            else if (v >= 1) lines.push(units[i] + ': ' + v.toFixed(2));
            else lines.push(units[i] + ': ' + v.toFixed(4));
        }
        document.getElementById('result').innerHTML = lines.join('<br>');
    }
</script>
