<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 实体 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.95rem; min-height:100px; resize:vertical; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; max-height:150px; overflow-y:auto; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔣 HTML 实体编解码</h2>
    <textarea id="htmlInput" placeholder="输入文本">&lt;div&gt;Hello &amp; World&lt;/div&gt;</textarea>
    <div class="flex">
        <button class="btn" onclick="encodeHTML()">🔒 转义 (编码)</button>
        <button class="btn green" onclick="decodeHTML()">🔓 反转义 (解码)</button>
        <button class="btn gray" onclick="clearHTML()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function encodeHTML() {
        const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
        const text = document.getElementById('htmlInput').value;
        document.getElementById('result').textContent = text.replace(/[&<>"']/g, m => map[m]);
    }
    function decodeHTML() {
        const text = document.getElementById('htmlInput').value;
        const txt = document.createElement('textarea');
        txt.innerHTML = text;
        document.getElementById('result').textContent = txt.value;
    }
    function clearHTML() { document.getElementById('htmlInput').value = ''; document.getElementById('result').textContent = '已清空'; }
</script>
</body>
</html>
