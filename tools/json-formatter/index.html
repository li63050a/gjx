<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:120px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.85rem; font-family:monospace; white-space:pre-wrap; word-break:break-all; max-height:300px; overflow-y:auto; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📋 JSON 格式化 / 压缩</h2>
    <textarea id="jsonInput">{"name":"小明","age":18,"hobbies":["阅读","编程"]}</textarea>
    <div class="flex">
        <button class="btn" onclick="formatJson()">📐 格式化</button>
        <button class="btn green" onclick="minifyJson()">📦 压缩</button>
        <button class="btn gray" onclick="clearJson()">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function formatJson() {
        try { const obj = JSON.parse(document.getElementById('jsonInput').value); document.getElementById('result').textContent = JSON.stringify(obj, null, 2); }
        catch(e) { document.getElementById('result').textContent = '❌ 无效 JSON: ' + e.message; }
    }
    function minifyJson() {
        try { const obj = JSON.parse(document.getElementById('jsonInput').value); document.getElementById('result').textContent = JSON.stringify(obj); }
        catch(e) { document.getElementById('result').textContent = '❌ 无效 JSON: ' + e.message; }
    }
    function clearJson() { document.getElementById('jsonInput').value = ''; document.getElementById('result').textContent = '已清空'; }
</script>

</body>
</html>
