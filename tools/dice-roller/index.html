<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骰子 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; width:90px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .dice { font-size:3rem; letter-spacing:8px; margin-top:14px; text-align:center; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🎲 骰子投掷</h2>
    <div class="row">
        <span>骰子数:</span><input type="text" id="count" value="2">
        <span>面数:</span><input type="text" id="sides" value="6">
        <button class="btn" onclick="roll()">投掷</button>
    </div>
    <div class="dice" id="dice">🎲</div>
    <div class="output-box" id="result">等待投掷...</div>
</div>
<script>
    var faces = {1:'⚀',2:'⚁',3:'⚂',4:'⚃',5:'⚄',6:'⚅'};
    function roll() {
        var n = parseInt(document.getElementById('count').value) || 1;
        var s = parseInt(document.getElementById('sides').value) || 6;
        if (n < 1 || n > 20 || s < 2 || s > 100) { document.getElementById('result').textContent='骰子数1-20，面数2-100'; return; }
        var res = [], sum = 0, sym = [];
        for (var i = 0; i < n; i++) {
            var v = Math.floor(Math.random()*s)+1;
            res.push(v); sum += v;
            sym.push(s<=6 ? faces[v] : '🎲');
        }
        document.getElementById('dice').textContent = sym.join(' ');
        document.getElementById('result').innerHTML = '点数: ' + res.join(', ') + '<br>合计: ' + sum;
    }
</script>
</body>
</html>
