<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄计算 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { flex:1; min-width:150px; padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🎂 年龄计算器</h2>
    <div class="row">
        <input type="date" id="birth">
        <button class="btn" onclick="calc()">计算年龄</button>
    </div>
    <div class="output-box" id="result">请选择出生日期</div>
</div>
<script>
    document.getElementById('birth').value = '2000-01-01';
    function calc() {
        var b = document.getElementById('birth').value;
        if (!b) { document.getElementById('result').textContent = '请选择出生日期'; return; }
        var bd = new Date(b), now = new Date();
        if (bd > now) { document.getElementById('result').textContent = '❌ 出生日期不能晚于今天'; return; }
        var years = now.getFullYear() - bd.getFullYear();
        var md = now.getMonth() - bd.getMonth();
        var dd = now.getDate() - bd.getDate();
        if (md < 0 || (md === 0 && dd < 0)) years--;
        if (dd < 0) { md--; var prev = new Date(now.getFullYear(), now.getMonth(), 0).getDate(); dd += prev; }
        if (md < 0) { md += 12; }
        var days = Math.floor((now - bd) / 86400000);
        document.getElementById('result').innerHTML =
            '🎂 年龄: ' + years + ' 岁 ' + md + ' 个月 ' + dd + ' 天<br>' +
            '📅 总共: ' + days + ' 天<br>' +
            '🕒 总共: ' + (days * 24) + ' 小时';
    }
</script>
