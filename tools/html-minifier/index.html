<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 压缩 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.85rem; min-height:110px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:220px; overflow-y:auto; font-size:0.8rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🗜️ HTML 压缩</h2>
    <textarea id="html" placeholder="粘贴 HTML 代码">&lt;div   class="x"  &gt;
    &lt;p&gt;  Hello   World  &lt;/p&gt;
&lt;/div&gt;</textarea>
    <div class="flex">
        <button class="btn" onclick="min()">压缩</button>
        <button class="btn gray" onclick="document.getElementById('html').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function min() {
        var s = document.getElementById('html').value;
        s = s.replace(/<!--[\s\S]*?-->/g, '');
        s = s.replace(/>\s+</g, '><').replace(/\s{2,}/g, ' ').replace(/\n/g, '');
        document.getElementById('result').textContent = s;
    }
</script>

<!--SITE-LINKS-->
<div style="margin-top:28px;padding:14px 0;text-align:center;font-size:0.8rem;color:#94a3b8;border-top:1px solid #e2e8f0;">🔗 项目: <a href="https://github.com/li63050a/gjx" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">GitHub 仓库</a> · <a href="https://gjx.z321.cc.cd/" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">gjx.z321.cc.cd</a></div>
</body>
</html>
