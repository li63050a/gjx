<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV ⇄ Markdown · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:120px; resize:vertical; font-family:monospace; }
        .flex { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.green { background:#16a34a; }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:250px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📊 CSV ⇄ Markdown 表格</h2>
    <textarea id="text" placeholder="粘贴 CSV 或 Markdown 表格">name,age,city
Alice,30,Beijing
Bob,25,Shanghai</textarea>
    <div class="flex">
        <button class="btn" onclick="csv2md()">CSV → MD</button>
        <button class="btn green" onclick="md2csv()">MD → CSV</button>
        <button class="btn gray" onclick="document.getElementById('text').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function csv2md() {
        var rows = document.getElementById('text').value.trim().split('\n');
        if (!rows.length) return;
        var md = [];
        for (var i = 0; i < rows.length; i++) {
            var cells = rows[i].split(',');
            md.push('| ' + cells.join(' | ') + ' |');
            if (i === 0) {
                var sep = [];
                for (var c = 0; c < cells.length; c++) sep.push('---');
                md.push('| ' + sep.join(' | ') + ' |');
            }
        }
        document.getElementById('result').textContent = md.join('\n');
    }
    function md2csv() {
        var rows = document.getElementById('text').value.trim().split('\n');
        var out = [];
        for (var i = 0; i < rows.length; i++) {
            var line = rows[i].trim();
            if (!line) continue;
            if (line.indexOf('|') !== 0) continue;
            if (/^\|[\s\-:|]+\|$/.test(line)) continue;
            var cells = line.replace(/^\|/, '').replace(/\|$/, '').split('|');
            for (var c = 0; c < cells.length; c++) cells[c] = cells[c].trim();
            out.push(cells.join(','));
        }
        document.getElementById('result').textContent = out.join('\n');
    }
</script>
</body>
</html>
