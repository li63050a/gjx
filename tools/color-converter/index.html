<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色转换 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { flex:1; min-width:150px; padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .color-preview { width:60px; height:60px; border-radius:12px; border:2px solid #e2e8f0; flex-shrink:0; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; }
        .flex { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🎨 HEX ↔ RGB ↔ HSL</h2>
    <div class="row">
        <input type="text" id="colorInput" placeholder="#3b82f6" value="#3b82f6">
        <button class="btn" onclick="convertColor()">🔄 转换</button>
    </div>
    <div class="flex">
        <div class="color-preview" id="preview" style="background:#3b82f6;"></div>
        <div class="output-box" id="result" style="flex:1;">RGB: rgb(59, 130, 246)<br>HSL: hsl(217, 91%, 60%)</div>
    </div>
</div>
<script>
    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1],16), g: parseInt(result[2],16), b: parseInt(result[3],16) } : null;
    }
    function rgbToHsl(r, g, b) {
        r/=255; g/=255; b/=255;
        const max = Math.max(r,g,b), min = Math.min(r,g,b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; }
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                case g: h = ((b - r) / d + 2) / 6; break;
                case b: h = ((r - g) / d + 4) / 6; break;
            }
        }
        return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
    }
    function convertColor() {
        const input = document.getElementById('colorInput').value.trim();
        const rgb = hexToRgb(input);
        if (!rgb) { document.getElementById('result').textContent = '❌ 无效的 HEX 颜色，请使用 #RRGGBB 格式'; return; }
        const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        const rgbStr = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        const hslStr = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
        document.getElementById('result').innerHTML = `RGB: ${rgbStr}<br>HSL: ${hslStr}`;
        document.getElementById('preview').style.background = rgbStr;
    }
    convertColor();
</script>
</body>
</html>
