<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input, .row select { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; font-family:monospace; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔢 进制转换</h2>
    <div class="row">
        <input type="text" id="numInput" placeholder="输入数字" value="255">
        <select id="fromBase">
            <option value="10">十进制 (10)</option>
            <option value="2">二进制 (2)</option>
            <option value="8">八进制 (8)</option>
            <option value="16">十六进制 (16)</option>
        </select>
        <button class="btn" onclick="convertBase()">转换</button>
    </div>
    <div class="output-box" id="result">等待转换...</div>
</div>
<script>
    function convertBase() {
        const val = document.getElementById('numInput').value.trim();
        const from = parseInt(document.getElementById('fromBase').value);
        if (!val) { document.getElementById('result').textContent = '请输入数字'; return; }
        const dec = parseInt(val, from);
        if (isNaN(dec)) { document.getElementById('result').textContent = '❌ 无效数字'; return; }
        document.getElementById('result').innerHTML =
            '🔢 十进制: ' + dec + '<br>' +
            '🔢 二进制: ' + dec.toString(2) + '<br>' +
            '🔢 八进制: ' + dec.toString(8) + '<br>' +
            '🔢 十六进制: ' + dec.toString(16).toUpperCase();
    }
</script>

</body>
</html>
