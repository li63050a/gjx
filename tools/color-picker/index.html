<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色选择器 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; flex:1; min-width:100px; }
        input[type=color] { width:60px; height:44px; border:1px solid #d1d5db; border-radius:10px; background:#fff; cursor:pointer; }
        .preview { width:100%; height:80px; border-radius:10px; margin:10px 0; border:1px solid #e2e8f0; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; word-break:break-all; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🎨 颜色选择器</h2>
    <div class="preview" id="preview"></div>
    <div class="row">
        <input type="color" id="picker" value="#2563eb" oninput="update()">
        <input type="text" id="hex" value="#2563EB" oninput="fromHex()">
        <button class="btn" onclick="copyHex()">复制 HEX</button>
    </div>
    <div class="output-box" id="result">等待操作...</div>
</div>
<script>
    function hexToRgb(h) {
        h = h.replace('#','');
        if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
        return { r:parseInt(h.substr(0,2),16), g:parseInt(h.substr(2,2),16), b:parseInt(h.substr(4,2),16) };
    }
    function rgbToHsl(r,g,b) {
        r/=255; g/=255; b/=255;
        var max=Math.max(r,g,b), min=Math.min(r,g,b), h,s,l=(max+min)/2;
        if (max===min){ h=s=0; }
        else {
            var d=max-min;
            s = l>0.5 ? d/(2-max-min) : d/(max+min);
            if (max===r) h=(g-b)/d+(g<b?6:0);
            else if (max===g) h=(b-r)/d+2;
            else h=(r-g)/d+4;
            h/=6;
        }
        return { h:Math.round(h*360), s:Math.round(s*100), l:Math.round(l*100) };
    }
    function update() {
        var hex = document.getElementById('picker').value;
        document.getElementById('hex').value = hex.toUpperCase();
        render(hex);
    }
    function fromHex() {
        var hex = document.getElementById('hex').value;
        if (/^#?[0-9a-fA-F]{6}$/.test(hex) || /^#?[0-9a-fA-F]{3}$/.test(hex)) {
            if (hex[0] !== '#') hex = '#' + hex;
            document.getElementById('picker').value = hex.length===4 ? '#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3] : hex;
            render(hex);
        }
    }
    function render(hex) {
        var rgb = hexToRgb(hex);
        var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        document.getElementById('preview').style.background = hex;
        document.getElementById('result').innerHTML =
            'HEX: ' + hex.toUpperCase() + '<br>' +
            'RGB: rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')<br>' +
            'HSL: hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';
    }
    function copyHex() {
        var hex = document.getElementById('hex').value;
        if (window.clipboardData) window.clipboardData.setData('Text', hex);
        else if (navigator.clipboard) navigator.clipboard.writeText(hex);
        document.getElementById('result').innerHTML += '<br>✅ 已复制 ' + hex.toUpperCase();
    }
    update();
</script>
