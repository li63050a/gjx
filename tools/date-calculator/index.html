<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期计算 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 700px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        .row input { flex:1; min-width:150px; padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; font-size:0.95rem; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>📅 日期计算器</h2>
    <div class="row">
        <input type="date" id="dateA">
        <span style="font-size:1.2rem;">➜</span>
        <input type="date" id="dateB">
        <button class="btn" onclick="calcDateDiff()">计算差值</button>
    </div>
    <div class="output-box" id="result">请选择两个日期</div>
</div>
<script>
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('dateA').value = today;
    const future = new Date(Date.now() + 7*24*60*60*1000).toISOString().slice(0,10);
    document.getElementById('dateB').value = future;

    function calcDateDiff() {
        const a = document.getElementById('dateA').value;
        const b = document.getElementById('dateB').value;
        if (!a || !b) { document.getElementById('result').textContent = '请选择两个日期'; return; }
        const d1 = new Date(a), d2 = new Date(b);
        const diffMs = d2 - d1;
        const diffDays = Math.floor(diffMs / (1000*60*60*24));
        const diffWeeks = Math.floor(diffDays / 7);
        const diffMonths = Math.floor(diffDays / 30.44);
        const abs = Math.abs;
        document.getElementById('result').innerHTML =
            '📅 相差天数: ' + abs(diffDays) + ' 天<br>' +
            '📅 相差周数: ' + abs(diffWeeks) + ' 周<br>' +
            '📅 相差月数 (约): ' + abs(diffMonths) + ' 月';
    }
</script>
</body>
</html>
