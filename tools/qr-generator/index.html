<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <title>二维码生成 · 超能工具箱</title>
    <script>var __t=localStorage.getItem("theme"); if(__t)document.documentElement.dataset.theme=__t;<\/script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 760px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        .row { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; align-items:center; }
        textarea, .row input, .row select { padding:8px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:1rem; width:100%; }
        textarea { min-height:70px; resize:vertical; font-family:monospace; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .out { text-align:center; margin-top:16px; }
        canvas { background:#fff; padding:12px; border-radius:12px; max-width:100%; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; word-break:break-all; font-size:0.85rem; font-family:monospace; white-space:pre-wrap; }
        .dark-note { color:#64748b; font-size:0.85rem; margin-top:6px; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🔳 二维码生成器</h2>
    <textarea id="text" placeholder="输入文本或网址，如 https://github.com/li63050a/gjx">https://github.com/li63050a/gjx</textarea>
    <div class="row">
        <select id="ec"><option value="L">纠错 L (7%)</option><option value="M" selected>纠错 M (15%)</option><option value="Q">纠错 Q (25%)</option><option value="H">纠错 H (30%)</option></select>
        <select id="size"><option value="4">模块 4px</option><option value="6" selected>模块 6px</option><option value="8">模块 8px</option><option value="10">模块 10px</option></select>
    </div>
    <div class="flex" style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" onclick="gen()">生成</button>
        <button class="btn gray" onclick="download()">下载 PNG</button>
    </div>
    <div class="out"><canvas id="cv" width="240" height="240"></canvas><div class="dark-note">提示：手机可长按图片保存</div></div>
    <div class="output-box" id="msg">输入内容后点击“生成”</div>
</div>
<script src="../../js/qrcode.js"></script>
<script>
    function gen(){
        var txt = document.getElementById('text').value;
        var ec = document.getElementById('ec').value;
        var px = parseInt(document.getElementById('size').value) || 6;
        if (!txt) { document.getElementById('msg').textContent = '请输入内容'; return; }
        try {
            var qr = qrcode(0, ec);
            qr.addData(txt);
            qr.make();
            var n = qr.getModuleCount();
            var cv = document.getElementById('cv');
            cv.width = cv.height = n * px;
            var ctx = cv.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
            ctx.fillStyle = '#000';
            for (var r=0;r<n;r++) for (var c=0;c<n;c++) if (qr.isDark(r,c)) ctx.fillRect(c*px, r*px, px, px);
            document.getElementById('msg').textContent = '已生成 · 版本模块 ' + n + '×' + n;
        } catch(e) {
            document.getElementById('msg').textContent = '生成失败：' + e.message + '（内容可能过长，请降低纠错级别或缩短内容）';
        }
    }
    function download(){
        var cv = document.getElementById('cv');
        var a = document.createElement('a');
        a.download = 'qrcode.png';
        a.href = cv.toDataURL('image/png');
        a.click();
    }
    gen();
</script>
<button onclick="__tg()" style="position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;border:none;background:#2563eb;color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)">🌙</button>
<script>function __tg(){var d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"":"dark";localStorage.setItem("theme",d?"":"dark");var b=document.querySelector('button[onclick="__tg()"]');b.textContent=d?"🌙":"☀️";}if(document.documentElement.dataset.theme==="dark"){var bx=document.querySelector('button[onclick="__tg()"]');if(bx)bx.textContent="☀️";}</script>
<!--SITE-LINKS-->
<div style="margin-top:28px;padding:14px 0;text-align:center;font-size:0.8rem;color:#94a3b8;border-top:1px solid #e2e8f0;">🔗 项目: <a href="https://github.com/li63050a/gjx" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">GitHub 仓库</a> · <a href="https://li63050a.github.io/gjx/" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">GitHub Pages</a> · <a href="https://gjx.z321.cc.cd/" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none;">gjx.z321.cc.cd</a></div>
</body>
</html>
