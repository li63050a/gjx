<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT 解析 · 超能工具箱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin:0 auto; background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .back { text-decoration:none; color:#2563eb; font-weight:600; display:inline-block; margin-bottom:16px; }
        h2 { margin-bottom:16px; }
        textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; font-size:0.9rem; min-height:80px; resize:vertical; font-family:monospace; }
        .btn { padding:8px 20px; background:#2563eb; color:#fff; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
        .btn:active { transform:scale(0.96); }
        .btn.gray { background:#6b7280; }
        .output-box { background:#f8fafc; padding:12px 16px; border-radius:10px; margin-top:12px; border-left:4px solid #2563eb; white-space:pre-wrap; max-height:300px; overflow-y:auto; font-size:0.85rem; font-family:monospace; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="../../index.html">← 返回工具箱</a>
    <h2>🪪 JWT 解析 (仅解码，不验证)</h2>
    <textarea id="jwt" placeholder="粘贴 JWT (xxx.yyy.zzz)">eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyIjoiYWRtaW4iLCJyb2xlIjoiYWRtaW4ifQ.x</textarea>
    <div class="flex" style="display:flex;gap:10px;margin:10px 0;">
        <button class="btn" onclick="decode()">解析</button>
        <button class="btn gray" onclick="document.getElementById('jwt').value=''">清空</button>
    </div>
    <div class="output-box" id="result">等待解析...</div>
</div>
<script>
    function b64urlDecode(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        try {
            if (typeof atob === 'function') return decodeURIComponent(escape(atob(s)));
            return decodeURIComponent(escape(window.atob(s)));
        } catch (e) { return null; }
    }
    function decode() {
        var t = document.getElementById('jwt').value.trim();
        var parts = t.split('.');
        if (parts.length < 2) { document.getElementById('result').textContent = '❌ 不是有效的 JWT'; return; }
        var head = b64urlDecode(parts[0]), pay = b64urlDecode(parts[1]);
        var out = '';
        if (head) { try { out += 'Header:\n' + JSON.stringify(JSON.parse(head), null, 2) + '\n\n'; } catch(e){ out += 'Header(原始): ' + head + '\n\n'; } }
        if (pay) { try { out += 'Payload:\n' + JSON.stringify(JSON.parse(pay), null, 2); } catch(e){ out += 'Payload(原始): ' + pay; } }
        else out += '❌ Payload 解码失败';
        document.getElementById('result').textContent = out;
    }
</script>
</body>
</html>
